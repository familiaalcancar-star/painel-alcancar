<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala · Família Alcançar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --hero-bg:#0B0B0D; --hero-ink:#F4F4F2;
  --bg:#000000; --surface:#121214; --ink:#F4F4F2; --muted:#A3A3A8; --line:#2A2A2E;
  --vine:#4CC24A; --vine-soft:#10291A; --gold:#FFC61A; --gold-soft:#2E2508;
  --night:#3AA0F5; --night-soft:#0D2134; --danger:#FF7A59; --danger-soft:#38170F;
  --orange:#F47216; --blue:#1E88E5; --yellow:#FFC61A; --green:#3DAA35;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 110px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
header.top .who img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.church{font-size:clamp(26px,6vw,34px);letter-spacing:-.01em}
.church small{display:block;font:500 14px/1.3 Figtree,sans-serif;color:var(--muted);letter-spacing:0;margin-top:4px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.month{display:flex;align-items:center;gap:4px}
.month strong{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;min-width:170px;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
.btn{border:0;background:var(--vine);color:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{margin:0 0 22px}
.day h3{font-size:18px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.day h3 span{font:500 14px Figtree,sans-serif;color:var(--muted)}
.culto{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:8px}
.culto.noite{border-left-color:var(--night)}
.culto-head{font-weight:600;font-size:14px;color:var(--gold);margin-bottom:4px}
.culto.noite .culto-head{color:var(--night)}
.slot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot .local{font-weight:600}
.slot .names{grid-column:1/2;color:var(--ink)}
.slot .obs{grid-column:1/2;font-size:14px;color:var(--muted)}
.slot .acts{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--vine-soft);color:var(--vine);margin-left:6px;vertical-align:1px}
.link{background:none;border:0;padding:2px 0;color:var(--muted);font-size:13px;text-decoration:underline}
.empty{border:1px dashed var(--line);border-radius:var(--radius-lg);padding:28px 20px;text-align:center;color:var(--muted)}
.notice{background:var(--gold-soft);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card h3{font-size:19px;margin-bottom:4px}
.meta{font-size:13px;color:var(--muted)}
.card p{margin:8px 0 0;white-space:pre-wrap}
.ev{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.ev .date{background:var(--vine-soft);color:var(--vine);border-radius:12px;text-align:center;padding:8px 4px;font-weight:600;line-height:1.1}
.ev .date b{display:block;font:700 26px "Bricolage Grotesque",sans-serif}
.log{font-size:14px;border-bottom:1px solid var(--line);padding:10px 0}
.log b{font-weight:600}
.log .diff{color:var(--muted);font-size:13px;margin-top:2px}
.act-criou{color:var(--vine)} .act-editou{color:var(--gold)} .act-excluiu{color:var(--danger)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:130px;min-width:0;background:none;border:0;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--vine)}
dialog{border:0;border-radius:var(--radius-lg);padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,15,.45)}
.sheet{padding:20px}
.sheet h2{font-size:22px;margin-bottom:14px}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea.inp{min-height:96px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sheet .end{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
.tbl-wrap{overflow-x:auto}
table.lead{border-collapse:collapse;width:100%;font-size:14px}
table.lead th,table.lead td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;white-space:nowrap}
.section-title{font-size:20px;margin:22px 0 10px}

.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:20px 18px 12px;margin-bottom:8px}
.hero .when{font-size:14px;opacity:.85;margin-bottom:2px}
.hero h2{font-size:clamp(28px,7vw,38px);letter-spacing:-.015em}
.hero .culto-nome{font:600 17px Figtree,sans-serif;margin:4px 0 12px;opacity:.95}
.areas{display:flex;flex-direction:column}
.area{border-top:1px solid var(--area-line)}
.area>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer}
.area>summary::-webkit-details-marker{display:none}
.area>summary .an{font-weight:600}
.area>summary .ac{display:block;font-size:14px;opacity:.8}
.area>summary .chev{margin-left:auto;transition:transform .15s;opacity:.7}
.area[open]>summary .chev{transform:rotate(90deg)}
.area .fx{padding:0 2px 12px}
.area .fn{margin:0 0 8px}
.area .fn b{display:block;font-size:13px;font-weight:600;opacity:.75}
.area .pend{opacity:.6;font-style:italic}
.hero .area{--area-line:rgba(255,255,255,.18)}
.hero .link{color:inherit;opacity:.85}
.hero .culto-t,.mini .culto-t{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;color:var(--yellow);margin:14px 0 2px;font-size:22px}
.hero .culto-t.noite,.mini .culto-t.noite{color:var(--night)}
.mini .culto-t{font-size:16px;margin:10px 0 0}
hr.div-culto{border:0;height:1px;background:rgba(255,255,255,.22);margin:12px 0 4px}
table.esc{border-collapse:separate;border-spacing:0;min-width:1040px;width:100%;font-size:14px}
table.esc th,table.esc td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.esc thead th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;padding-bottom:8px}
table.esc thead th:first-child{position:sticky;left:0;background:var(--bg);z-index:2}
table.esc tbody th{position:sticky;left:0;background:var(--bg);z-index:1;white-space:nowrap;border-left:3px solid var(--yellow);padding-left:10px}
table.esc tr.noite th{border-left-color:var(--night)}
table.esc .dt{display:block;font-weight:700}
table.esc .ct{display:block;font-size:12px;color:var(--muted)}
.cell{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600;min-height:40px}
.cell.vazio{color:var(--muted);font-weight:400;font-style:italic;background:transparent;border-style:dashed}
.cell.dl{color:var(--yellow);text-align:center;white-space:nowrap}
.help-btn{position:absolute;top:0;left:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink);z-index:1}
.tut{padding:0 16px}
.tut>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 0;font:700 17px "Bricolage Grotesque",Figtree,sans-serif;cursor:pointer}
.tut>summary::-webkit-details-marker{display:none}
.tut>summary .chev{transition:transform .15s;opacity:.7}
.tut[open]>summary .chev{transform:rotate(90deg)}
.tut ol{margin:0 0 14px;padding-left:20px}
.tut li{margin:6px 0}
.tut b{color:var(--yellow);font-weight:600}
.clamp{display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.clamp.aberto{display:block;-webkit-line-clamp:unset;line-clamp:unset}
.lermais{color:var(--yellow);font-weight:600;font-size:14px;text-decoration:none;margin-top:4px}
.banner{display:block;width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;object-position:center top;border-radius:12px;margin:0 0 12px;background:var(--line)}
.soon + .banner, .banner + .soon{margin-top:0}
.horarios{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.horarios div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.horarios span{font-size:14px;color:var(--muted)}
.horarios b{display:block;font:700 24px "Bricolage Grotesque",Figtree,sans-serif;color:var(--yellow)}
.igreja p{margin:12px 0 0}
.vemeve{font:700 24px "Bricolage Grotesque",Figtree,sans-serif;text-align:center;letter-spacing:.06em;color:var(--yellow);margin-top:16px!important}
.redes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rede-card{display:block;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.rede-card .prev{height:150px;background-size:cover;background-position:center;filter:blur(1px) brightness(.92);transform:scale(1.03);position:relative}
.rede-card .prev.vazio{filter:none;transform:none;display:grid;place-items:center}
.rede-card.ig .prev.vazio{background:radial-gradient(circle at 30% 110%,#FDD56B 0,#F58529 25%,#DD2A7B 55%,#8134AF 80%,#515BD4 100%)}
.rede-card.yt .prev.vazio{background:linear-gradient(160deg,#2a0a08,#E62117)}
.rede-card .marca{color:#fff;opacity:.9;transform:scale(2.6);display:block}
.rede-info{display:flex;align-items:center;gap:12px;padding:12px 14px}
.rede-info b{display:block;font-size:15px}.rede-info small{display:block;font-size:12px;color:var(--muted)}
.rede-card.ig .ic{color:#DD2A7B}.rede-card.yt .ic{color:#E62117}
.rede-info .cta{margin-left:auto;font-weight:600;font-size:14px;color:var(--yellow)}
.dest{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.dest:first-of-type{border-top:0}.dest .ig{color:#DD2A7B}.dest .yt{color:#E62117}
.btn.insc{display:inline-block;margin-top:10px;text-decoration:none;background:var(--yellow);color:#000}
.zaps .insc{margin-top:0}
.zaps{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.btn.zap{display:inline-block;text-decoration:none;background:#25D366;color:#000}
.card p a,.soon a:not(.btn){color:var(--night)}
.fcard h3{font-size:18px}
.fcard ul{margin:8px 0 0;padding-left:20px}
.fcard li{margin:3px 0}
.hero .btn.ghost{color:inherit;border-color:rgba(255,255,255,.45)}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 14px 4px;--area-line:var(--line)}
.mini h3{font-size:17px}
.mini .culto-nome{font-size:14px;color:var(--muted);margin-bottom:6px}
.mini .area>summary{padding:9px 0;font-size:15px}
.mini .area>summary .ac{color:var(--muted);opacity:1}
.culto-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:var(--radius-sm);padding:12px 14px 4px;margin-bottom:10px;--area-line:var(--line)}
.culto-card.noite{border-left-color:var(--night)}
.culto-card .culto-head{font-weight:600;font-size:15px;color:var(--gold);margin-bottom:4px}
.culto-card.noite .culto-head{color:var(--night)}
.slotgrid{display:grid;gap:6px}
fieldset.fs{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:12px 0 0}
fieldset.fs legend{font-weight:600;font-size:14px;padding:0 4px}
.soon{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.soon:first-child{border-top:0}
.soon .date{background:var(--gold-soft);color:var(--gold);border-radius:12px;text-align:center;padding:6px 2px;font-weight:600;font-size:13px;line-height:1.1}
.soon .date b{display:block;font:700 22px "Bricolage Grotesque",sans-serif}

header.top{flex-direction:column;align-items:center;gap:6px;margin-bottom:20px;position:relative;text-align:center}
header.top .who{position:absolute;top:0;right:0;margin:0}
.logo{width:clamp(150px,42vw,210px);height:auto;display:block;margin:8px auto 0}
.role{display:block;font:500 14px/1.3 Figtree,sans-serif;color:var(--muted)}
.brand-line{display:flex;align-items:center;gap:10px;width:min(320px,80%);margin-top:4px}
.brand-line i{flex:1;height:3px;border-radius:3px}
.brand-line i:first-child{background:var(--blue)} .brand-line i:last-child{background:var(--green)}
.brand-line b{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{color:#000}
.btn.ghost{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--yellow);color:#000;border-color:var(--yellow)}
nav.tabs button[aria-current="page"]{color:var(--yellow)}
:focus-visible{outline-color:var(--orange)}
.hero{border:2px solid transparent;background:linear-gradient(var(--hero-bg),var(--hero-bg)) padding-box,linear-gradient(100deg,var(--blue),var(--yellow) 50%,var(--green)) border-box}
.hero .when{color:var(--orange);opacity:1;font-weight:600}
.hero .area{--area-line:rgba(255,255,255,.12)}
.soon .date{background:var(--gold-soft);color:var(--yellow)}
.hero h2::first-letter,.mini h3::first-letter,.culto-card .culto-head::first-letter,.month strong::first-letter{text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
.lst{padding:4px 14px}
.lst .li{display:grid;grid-template-columns:62px 1fr auto 14px;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;text-align:left;color:var(--ink)}
.lst .li:first-child{border-top:0}
.lst .ld{display:flex;flex-direction:column;line-height:1.15;font-size:12px;color:var(--muted);text-transform:capitalize}
.lst .ld b{font:700 17px "Bricolage Grotesque",sans-serif;color:var(--yellow)}
.lst .lt{font-weight:600;line-height:1.3}
.lst .lh{font-size:14px;color:var(--muted);white-space:nowrap}
.lst .la{font-size:22px;color:var(--muted);line-height:1}
.btn.big{display:block;text-align:center;font-size:17px;padding:14px 20px;margin-top:12px;text-decoration:none}
.card.flash{box-shadow:0 0 0 3px var(--yellow);transition:box-shadow .3s}
.help-btn{display:none!important}</style>
</head>
<body>

cativo, receber em casa e depois levar para a igreja;\n2. Se preferir, pode fazer o PIX para nós e faremos a compra (fale comigo no privado);\n3. Também pode comprar presencialmente. Nesse caso, só pedimos que confira se é BRANCO QUENTE e 110/127V.\n\nDeus abençoe ❤️", "titulo": "Cantata de Natal: Campanha do Pisca-Pisca"}}, {"id": "av-2026-10-25-cni", "d": {"atualizadoEm": "2026-10-25T04:30:00.000Z", "autor": "u_OKuPpDgAa3A_5sVZqEdvbQ", "conexao": null, "criadoEm": "2026-10-25T02:30:00.000Z", "img": "data:image/webp;base64,UklGRrJ3AABXRUJQVlA4IKZ3AABQ1wGdASrQApUBPpFEm0qlo6kzKBSaYmASCU3ff2Jk/74evr+H5FNcq19vbe7OHl/zxe1tLv9Tz5eN+8n3v+C/XHxBf2fKfuDzsum//R/nPZ5/1PWh+pf/X+f/0Efq7/tP7z67nrq/ef1Hf1D/SfuN7xP/Z/bf3t/43/h/lj8hf97/0X/47ID0KvLt/d/4df67/0/3M+BH+ef5r/7ewB///bu6PftX/n/ye98Px79//zf5gehf5P9X/lf8D/gf+F7B/+/5ievP+d6Kfyv7/ftP79+8nxQ/wP+p+XnoH8uP9z/J+wX+Q/zv/U/3v92v8n8lPdbvnuD/5PoEe4X2H/of5f1sfm/+L/lvVn7P/+P3Af6J/b/+r7G/8Xwyvzn/Y9gP+ef3//3/6r3d/8X/5f7v80/cl9Zftt8Bv8+/vn/j/yXt3f//3Y/vJ////d8P/7ul8je9xAYXcJ6G7/TfbWf/rqg4n01n5XbNivWAx5/rz59pqwcQkqVKkJ4nyJrEazr3KPr8xQztq3DzHwNKEXqFnyrjg1LwV0/jdFxnw+ajMRRHI3xm+XQWDuYUA3N//p2X1/9axcx2Fq///9lJPY9tiq61jZeTduOYTtxPVmnxRnjIrQczNSIeoyjCiqK2iADt9OnEj/Cpux1Iq8gY/11VmpoZ4pXUA6+d51UygQgo13/3u+C/7oxYuHH/FwhjAX//hs+YhshIvzGNYrhK5KOQoX4w4wRYKceE+RSsF8x0KBrwBBc4GVbjABQTAlB+dkV7mi2ix/rM/hVWZpImExpPMMr5Teh/IC0X1gIaTy0zTCGjZAaDsBkGCDO1sZvS+AGCp0qj7bPfX5V1vVycp+3NEHsWwLNNNlGlk8XS8DDiPVh86QULDVFEG0Lp8UKgedv6RYqikDTVC55APkpaI1UhLaViilIHrZojPC5xCDCkjak1hxxcfeqzE/SdFnTB41C5OvlkVVOSmjjGjyexyaBp0BERc2K87JVgYKeTBbUAQISyhuX7YNfSbKGF6MvAnl9XoQn6IX6T0eoCDKvM9cemMb9oXbNk/xC2Tc9109WeJfanKDP0XfN8YeB/LM4jgxXlQDMojXTbJH1KJG+tFEOeqQtei4FWcKkJrn2xDdxRRXuJP729/KardVJcErY49Fp8IEyJ7rflef70pJ7esxJ6joog0z+rL6S4Bc62HBoi93U1ysgsLgn8WuUjaqnKBgXYB4nJzphw6mgKLDrPfJaDHrxcQSeVD1ompCJkF+BDwgPCjXHYdsyusZqJBGYCbKmg4YOkpWzA+cs6EXNZPDgV6GPz5UlSF6gJQnbxpdsOgPuB18MzvRMI9jgyip8sqDZXEbIGrVgHJZJBSOBc8E72Zn7nLtbyUOUVxtDzWpxyEEWW/9TfanGKHQGg0QsX0BgzU+JVGUwaBccAwxflIv14i+94GsxykYMMhg function confirmar(msg){ return new Promise(ok => {
  const o = document.createElement('div'); o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true');
  o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px';

  o.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b && e.target !== o) return; e.stopPropagation(); o.remove(); ok(!!b && b.dataset.r === '1'); });

const semLouvor = rows => rows.filter(r => !ehLouvor(r.area));
const diasCulto = () => (S.cfg && S.cfg.diasCulto) || [0];
const conexaoNome = id => (conexoes().find(c=>c.id===id)||{}).nome || '';

const areaInfo = id => areas().find(a=>a.id===id) || {id, nome:id, porConexao:false, funcoes:[{nome:'Equipe',vagas:0}]};

const isAdm = () => S.isOwner || (pessoaDe(S.uid)||{}).papel === 'admin';
const minhas = () => { const p = pessoaDe(S.uid); return p && (p.papel==='lider' || p.papel==='auxiliar') && p.conexao ? [p.conexao] : []; };
const podeConexao = cid => isAdm() || minhas().includes(cid);
const LOUVOR_CON = ['flechas','forasteiros','herois'];
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const podeLouvor = () => { const p = pessoaDe(S.uid); return !!p && p.papel === 'lider' && LOUVOR_CON.includes(semAcento(conexaoNome(p.conexao))); };

const eLider = () => isAdm() || minhas().length > 0;
const papelTexto = () => 'Somente visualização · atualizado em '+PUB_STAMP; const _papelOrig = () => { if (isAdm()) return 'Administrador'; const p = pessoaDe(S.uid);

/* ---------- gravação com histórico ---------- */
async function logar(acao, tipo, resumo, antes, depois){
  const limpa = o => { if (!o) return null; const {img, ...r} = o; return r; };
  try { await S.db.collection('log/'+S.uid+'/e').add({acao, tipo, resumo, antes:limpa(antes), depois:limpa(depois), em:new Date().toISOString(), por:S.uid}); }
  catch(e){ console.warn('log', e); }
}
async function salvar(ref, data, ctx){
  try { await ref.set(data); await logar(ctx.acao, ctx.tipo, ctx.resumo, ctx.antes, data); return true; }
  catch(e){ falhaEscrita(e); return false; }
}
async function excluir(ref, antes, tipo, resumo){
  try { await ref.delete(); await logar('excluiu', tipo, resumo, antes, null); return true; }
  catch(e){ falhaEscrita(e); return false; }
}
function falhaEscrita(e){
  if (e && e.code === 'invalid_argument') { S.readOnlyHit = true; toast('Sem permissão para salvar. Peça ao administrador para te convidar como Editor.'); render(); }
  else if (e && e.code === 'quota_exceeded') toast('O espaço do painel está cheio. Avise o administrador.');
  else toast('Não foi possível salvar agora. Tente de novo em instantes.');
}
const semId = o => { const {id, ...r} = o; return r; };

async function resolverNomes(ids){

/* ---------- cultos ---------- */
function horaPassou(dataIso, hora){
  if (dataIso !== hoje() || !hora) return false;
  const m = String(hora).match(/(\d{1,2})(?:\s*[:h]\s*(\d{2}))?/); if (!m) return false;
  const fim = new Date(); fim.setHours(Number(m[1])+2, Number(m[2]||0), 0, 0);
  return new Date() > fim;
}
function listaCultos(ini, fim, escalas){
  const set = new Map();
  for (let d = ini; d <= fim; d = somaDias(d,1)) {
    if (diasCulto().includes(new Date(d+'T12:00:00').getDay())) cultos().forEach(c => set.set(d+'_'+c.id, {data:d, culto:c.id}));
  }
  escalas.forEach(x => { if (x.data>=ini && x.data<=fim) set.set(x.data+'_'+x.culto, {data:x.data, culto:x.culto}); });
  const ord = id => { const i = cultos().findIndex(c=>c.id===id); return i<0?99:i; };
  return [...set.values()].sort((a,b) => a.data===b.data ? ord(a.culto)-ord(b.culto) : a.data.localeCompare(b.data));
}
const escalaDe = (lista, data, culto, area) => lista.find(x => x.data===data && x.culto===culto && x.area===area);
const docId = (data, culto, area) => data+'_'+culto+'_'+area;

function blocoArea(lista, c, a){
  const x = escalaDe(lista, c.data, c.culto, a.id);
  const pode = podeArea(a, x);
  let resumo;
  if (a.porConexao) resumo = conexoesDe(x).length ? (conexoesDe(x).length>1?'Conexões ':'Conexão ')+esc(conexoesTxt(x)) : '<span class="pend">A definir</span>';
  else { const n = x ? (x.funcoes||[]).reduce((s,f)=>s+(f.pessoas||[]).length,0) : 0; resumo = n ? (a.funcoes.length===1 && n<=2 ? esc((x.funcoes[0].pessoas||[]).join(' e ')) : 'Ver equipe ('+n+')') : (x && x.obs ? esc(x.obs) : '<span class="pend">A definir</span>'); }
  const fx = a.funcoes.map(f => {
    const salvo = x ? ((x.funcoes||[]).find(g=>g.nome===f.nome)||{}).pessoas || [] : [];
    const total = f.vagas ? Math.max(f.vagas, salvo.length) : salvo.length;
    if (!total) return '';
    const nomes = total ? Array.from({length:total}, (_,i) => salvo[i] ? esc(salvo[i]) : '<span class="pend">vaga aberta</span>').join(', ') : '<span class="pend">ninguém escalado</span>';
    return '<p class="fn"><b>'+esc(f.nome)+(f.vagas?' · '+f.vagas+(f.vagas>1?' pessoas':' pessoa'):'')+'</b>'+nomes+'</p>';
  }).join('') + (x && x.obs ? '<p class="fn"><b>Observação</b>'+esc(x.obs)+'</p>' : '')
    + (pode ? '<button class="link" data-esc="'+esc(docId(c.data,c.culto,a.id))+'" data-d="'+c.data+'" data-c="'+esc(c.culto)+'" data-a="'+esc(a.id)+'">'+(x?'Editar escala':'Preencher escala')+'</button>' : '');
  return '<details class="area"><summary><span><span class="an">'+esc(a.nome)+'</span><span class="ac">'+resumo+'</span></span><span class="chev" aria-hidden="true">›</span></summary><div class="fx">'+fx+'</div></details>';
}
const blocosCulto = (lista, c) => '<div class="areas">'+areas().map(a => blocoArea(lista, c, a)).join('')+'</div>';
const cultoTitulo = c => { const i = cultoInfo(c.culto); return 'Culto da '+i.nome.toLowerCase()+(i.hora?' · '+i.hora:''); };

const imgTag = (src, cls) => src && /^data:image\//.test(src) ? '<img class="'+cls+'" src="'+esc(src)+'" alt="" loading="lazy">' : '';
async function arquivoParaImg(file){
  const bmp = await createImageBitmap(file); const w = Math.min(720, bmp.width), h = Math.round(bmp.height*w/bmp.width);
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  let q = 0.72, d = c.toDataURL('image/webp', q); if (!/^data:image\/webp/.test(d)) d = c.toDataURL('image/jpeg', q);
  while (d.length > 150000 && q > 0.35) { q -= 0.1; d = c.toDataURL(d.startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg', q); }
  return d;
}

function linhasMes(){ return linhasDe(S.mesEsc.filter(x => S.filtro==='todas' || conexoesDe(x).includes(S.filtro))); }
function linhasDe(lista){
  const rows = [];
  lista.slice()
    .sort((a,b)=>(a.data+cultos().findIndex(c=>c.id===a.culto)+areas().findIndex(r=>r.id===a.area)).localeCompare(b.data+cultos().findIndex(c=>c.id===b.culto)+areas().findIndex(r=>r.id===b.area)))
    .forEach(x => { const c = cultoInfo(x.culto);
      (x.funcoes||[]).forEach(f => (f.pessoas||[]).forEach(p => rows.push({data:x.data, dia:new Date(x.data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'}), culto:c.nome, hora:c.hora||'', area:areaInfo(x.area).nome, conexao:conexoesTxt(x), funcao:f.nome, pessoa:p, obs:x.obs||''})));
    });

function imprimirAqui(doc){

function exportarCSV(rows = linhasMes(), arquivo){

    if (g !== grupo) { if (grupo) body.push(''); body.push(q(g.charAt(0).toUpperCase()+g.slice(1))); body.push(head.map(q).join(';')); grupo = g; }
    body.push([r.area, r.funcao, r.pessoa, '', '', ''].map(q).join(';')); });
  baixar(arquivo || ('escala-'+S.mes+(S.filtro!=='todas'?'-'+S.filtro:'')+'.csv'), '\uFEFF'+body.join('\r\n'));
}

/* ---------- check-in em PDF e Excel ---------- */
const LIBS = {};
function carregar(src){ return LIBS[src] ||= new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { delete LIBS[src]; err(new Error('lib')); }; document.head.appendChild(s); }); }
const JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const AUTOTABLE = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
const EXCELJS = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
const CK_HEAD = ['Área','Função','Nome','Check-in','Assinatura retirada (equipamento / crachá)','Assinatura devolução (equipamento / crachá)'];
function dadosCheckin(d, c){
  const ci = cultoInfo(c); const sub = fmtDia(d)+' · Culto da '+ci.nome.toLowerCase()+(ci.hora?' · '+ci.hora:'');
  return { rows: semLouvor(linhasDe(todasEscalas().filter(x => x.data===d && x.culto===c))), titulo: ((S.cfg&&S.cfg.igreja)||'Igreja')+' · Check-in', sub: sub.charAt(0).toUpperCase()+sub.slice(1), arq: 'checkin-'+d+'-'+c };
}
async function checkinDiaPDF(d, btn){
  if (!temGestao()) { toast('Só administradores e a Gestão podem imprimir o check-in.'); return; }
  const ks = cultos().map(c => dadosCheckin(d, c.id)).filter(k => k.rows.length);
  if (!ks.length) { toast('Não há escala preenchida neste dia.'); return; }
  const txt = btn.textContent; btn.textContent = 'Gerando…'; btn.disabled = true;
  try {
    await carregar(JSPDF); await carregar(AUTOTABLE);
    const doc = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    ks.forEach((k, i) => { if (i) doc.addPage(); folhaCheckin(doc, k); });
    await baixar('checkin-'+d+'.pdf', doc.output('arraybuffer'));
  } catch(e) { console.warn(e); toast('Não foi possível gerar o PDF agora.'); }
  finally { btn.textContent = txt; btn.disabled = false; }
}
function folhaCheckin(doc, k){
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(k.titulo, 14, 16);

      styles:{fontSize:10, cellPadding:3, minCellHeight:12, valign:'middle', lineColor:[110,110,110], lineWidth:0.2, textColor:[20,20,20]},

      styles:{fontSize:10, cellPadding:3, minCellHeight:12, valign:'middle', lineColor:[110,110,110], lineWidth:0.2, textColor:[20,20,20]},

async function checkinXLSX(d, c, btn){
  if (!temGestao()) { toast('Só administradores e a Gestão podem imprimir o check-in.'); return; }
  const k = dadosCheckin(d, c); if (!k.rows.length) { toast('Não há escala preenchida neste culto.'); return; }

async function exportarPeriodo(tipo, btn){
  const de = S.perDe, ate = S.perAte;
  if (!de || !ate || de > ate) { toast('Confira as datas: “De” precisa vir antes de “Até”.'); return; }

    const s = await S.db.collection('escalas').where('data','>=',de).where('data','<=',ate).orderBy('data','asc').limit(2000).get();
    const lista = s.docs.map(d => ({id:d.id, ...d.data()})).filter(x => S.filtro==='todas' || conexoesDe(x).includes(S.filtro));
    if (S.perTipo === 'checkin' && !temGestao()) S.perTipo = 'escala';
    const rows = S.perTipo === 'checkin' ? semLouvor(linhasDe(lista)) : linhasDe(lista);
    if (!rows.length) { toast('Não há escala preenchida nesse período.'); return; }
    const grupos = []; rows.forEach(r => { const g = fmtDia(r.data)+' · Culto da '+r.culto.toLowerCase()+(r.hora?' · '+r.hora:''); const t = g.charAt(0).toUpperCase()+g.slice(1);
      if (!grupos.length || grupos[grupos.length-1].t !== t) grupos.push({t, rows:[]}); grupos[grupos.length-1].rows.push(r); });
    const ck = S.perTipo === 'checkin';
    const titulo = ((S.cfg&&S.cfg.igreja)||'Igreja')+(ck?' · Check-in de ':' · Escala de ')+dataBR(de)+' a '+dataBR(ate)+(S.filtro!=='todas'?' · '+conexaoNome(S.filtro):'');
    const arq = (ck?'checkin-':'escala-')+de+'-a-'+ate;
    const HEAD = ck ? CK_HEAD : ['Área','Conexão','Função','Nome'];
    const vals = r => ck ? [r.area, r.funcao, r.pessoa, '', '', ''] : [r.area, r.conexao, r.funcao, r.pessoa];
    const nc = HEAD.length; const ult = String.fromCharCode(64+nc);
    if (tipo === 'pdf') {
      await carregar(JSPDF); await carregar(AUTOTABLE);
      const doc = new window.jspdf.jsPDF({orientation: ck?'landscape':'portrait', unit:'mm', format:'a4'});
      doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text(titulo, 14, 16);
      const body = []; grupos.forEach(g => { body.push([{content:g.t, colSpan:nc, styles:{fillColor:[235,235,235], fontStyle:'bold'}}]); g.rows.forEach(r => body.push(vals(r))); });
      doc.autoTable({ startY:22, theme:'grid', head:[ck ? HEAD.map(h => h.replace(' (', '\n(')) : HEAD], body, styles:{fontSize:9.5, cellPadding:2.4, minCellHeight: ck?10:0, valign:'middle', lineColor:[150,150,150], lineWidth:0.2, textColor:[20,20,20]}, headStyles:{fillColor:[25,25,25], textColor:255, fontStyle:'bold'},
        columnStyles: ck ? {0:{cellWidth:34}, 1:{cellWidth:50}, 2:{cellWidth:46}, 3:{cellWidth:20}} : {} });
      await baixar(arq+'.pdf', doc.output('arraybuffer'));
    } else {
      await carregar(EXCELJS);
      const wb = new window.ExcelJS.Workbook();
      const ws = wb.addWorksheet(ck?'Check-in':'Escala', {pageSetup:{orientation: ck?'landscape':'portrait', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0}});
      ws.columns = ck ? [{width:20},{width:30},{width:26},{width:11},{width:32},{width:32}] : [{width:22},{width:22},{width:30},{width:30}];
      ws.mergeCells('A1:'+ult+'1'); ws.getCell('A1').value = titulo; ws.getCell('A1').font = {bold:true, size:13};
      const borda = {style:'thin', color:{argb:'FF888888'}}; const bordas = {top:borda, left:borda, bottom:borda, right:borda};
      let n = 3; const hr = ws.getRow(n); hr.values = HEAD; hr.height = ck?32:18; hr.eachCell(c => { c.font = {bold:true, color:{argb:'FFFFFFFF'}}; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF191919'}}; c.border = bordas; c.alignment = {vertical:'middle', wrapText:true}; }); ws.pageSetup.printTitlesRow = '3:3';
      grupos.forEach(g => { n++; ws.mergeCells('A'+n+':'+ult+n); const c = ws.getCell('A'+n); c.value = g.t; c.font = {bold:true}; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFEDEDED'}}; c.border = bordas;
        g.rows.forEach(r => { n++; const row = ws.getRow(n); row.values = vals(r); if (ck) row.height = 26; for (let k = 1; k <= nc; k++) { row.getCell(k).border = bordas; row.getCell(k).alignment = {vertical:'middle', wrapText:true}; } }); });
      await baixar(arq+'.xlsx', await wb.xlsx.writeBuffer());
    }
  } catch(e) { console.warn(e); toast('Não foi possível gerar o arquivo agora.'); }
  finally { btn.textContent = txt; btn.disabled = false; }
}

    const ref = ev ? S.db.doc('eventos/'+ev.id) : S.db.collection('eventos').doc();
    const ok = await salvar(ref, data, {acao:ev?'editou':'criou', tipo:'evento', resumo:data.titulo+' · '+fmtCurto(data.data), antes:ev?semId(ev):null});
    if (ok) toast(ev?'Evento atualizado':'Evento salvo'); return ok;
  });
}

/* ---------- HISTÓRICO ---------- */
let histCache = null, histCarregando = false, histTipo = 'todos';
function viewHistorico(){
  if (!isAdm()) return '<div class="empty">Só administradores acessam o histórico.</div>';
  const tipos = [{id:'todos',nome:'Tudo'},{id:'escala',nome:'Escalas'},{id:'aviso',nome:'Avisos'},{id:'evento',nome:'Agenda'},{id:'config',nome:'Ajustes'}];
  const top = '<div class="bar"><h2 style="font-size:22px">Histórico de alterações</h2><span style="flex:1"></span><button class="btn ghost small" data-hist-reload>Atualizar</button>'+(S.dl?'<button class="btn ghost small" data-hist-csv>Baixar</button>':'')+'</div>'
    + '<div class="chips">'+tipos.map(t=>'<button class="chip" data-hist-tipo="'+t.id+'" aria-pressed="'+(histTipo===t.id)+'">'+t.nome+'</button>').join('')+'</div>';
  if (!histCache) return top + '<div class="empty">Carregando histórico…</div>';
  const itens = histCache.filter(l => histTipo==='todos' || l.tipo===histTipo);
  if (!itens.length) return top + '<div class="empty">Nenhuma alteração registrada ainda.</div>';
  return top + '<div class="card">' + itens.slice(0,300).map(l => '<div class="log"><b>'+esc(nome(l.por))+'</b> <span class="act-'+esc(l.acao)+'">'+esc(l.acao)+'</span> '+esc(l.tipo)+': '+esc(l.resumo)
    + '<div class="diff">'+esc(fmtQuando(l.em))+(l.acao==='editou'?' · '+esc(diff(l.antes,l.depois)):'')+'</div></div>').join('') + '</div>';
}
const fmtFuncoes = fs => (fs||[]).map(f => f.nome+': '+((f.pessoas||[]).join(', ')||'—')).join('; ');
function diff(a,b){
  if (!a||!b) return '';
  const nomes = {data:'data',culto:'culto',conexao:'conexão',conexoes:'conexões',funcoes:'equipe',pessoas:'pessoas',obs:'obs',titulo:'título',texto:'mensagem',hora:'horário',local:'local',descricao:'detalhes'};
  const out = [];
  for (const k of Object.keys(nomes)) { const x = JSON.stringify(a[k]??''), y = JSON.stringify(b[k]??''); if (x!==y) out.push(nomes[k]+': '+fmtV(k,a[k])+' → '+fmtV(k,b[k])); }
  return out.join(' | ') || 'sem mudança visível';
}
const fmtV = (k,v) => k==='funcoes' ? fmtFuncoes(v) : k==='conexao' ? (conexaoNome(v)||'—') : k==='conexoes' ? ((v||[]).map(conexaoNome).join(', ')||'—') : Array.isArray(v) ? v.join(', ') : (v==null||v==='' ? '—' : String(v));
async function carregarHistorico(force){
  if ((histCache && !force) || histCarregando) return; histCarregando = true;
  try {
    const ids = [...new Set([...S.membros, S.uid].filter(Boolean))];
    const res = await Promise.all(ids.map(id => S.db.collection('log/'+id+'/e').orderBy('em','desc').limit(150).get().then(s=>s.docs.map(d=>d.data())).catch(()=>[])));
    histCache = res.flat().sort((a,b)=>b.em.localeCompare(a.em));
    await resolverNomes(histCache.map(l=>l.por));
  } finally { histCarregando = false; }
  if (S.tab==='historico') $('#view').innerHTML = viewHistorico();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.histTipo) { histTipo = t.dataset.histTipo; render(); }
  if ('histReload' in t.dataset) { histCache = null; render(); carregarHistorico(true); }
  if ('histCsv' in t.dataset && histCache) {
    const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
    const lines = [['Quando','Quem','Ação','Tipo','Item','Mudanças'].map(q).join(';'), ...histCache.map(l => [fmtQuando(l.em), nome(l.por), l.acao, l.tipo, l.resumo, l.acao==='editou'?diff(l.antes,l.depois):''].map(q).join(';'))];
    baixar('historico-painel.csv', '\uFEFF'+lines.join('\r\n'));
  }
});

    + '<label class="f" for="cI">Nome da igreja</label><input class="inp" id="cI" name="igreja" value="'+esc(c.igreja||'')+'">'
    + '<label class="f" for="cC">Conexões</label><textarea class="inp" id="cC" name="conexoes">'+esc(conexoes().map(x=>x.nome).join('\n'))+'</textarea><div class="hint">Uma por linha. A ordem alfabética é automática.</div>'

document.addEventListener('submit', async e => {
  if (e.target.id !== 'cfgForm') return; e.preventDefault();
  const fd = new FormData(e.target); const old = S.cfg || {};
  const lines = k => String(fd.get(k)||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const data = { ...old, igreja:String(fd.get('igreja')||'').trim(),
    conexoes: lines('conexoes').map(n=>({id:slug(n), nome:n})),
    cultos: lines('cultos').map(l => { const [n,h] = l.split('|').map(s=>s.trim()); return {id:slug(n), nome:n, hora:h||''}; }),
    diasCulto: fd.getAll('dia').map(Number),
    redes: {...(old.redes||{}), instagram:String(fd.get('instagram')||'').trim(), youtube:String(fd.get('youtube')||'').trim()},
    destaques: lines('destaques').map(l => { const k = l.lastIndexOf('|'); return k > 0 ? {titulo:l.slice(0,k).trim(), link:l.slice(k+1).trim()} : null; }).filter(Boolean) };
  if (await salvar(S.db.doc('config/geral'), data, {acao:'editou', tipo:'config', resumo:'Ajustes do painel', antes:null})) toast('Ajustes salvos');
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button[data-rm-pessoa]'); if (!t || !isAdm()) return;
  const id = t.dataset.rmPessoa; const quem = nomeComp(id);
  if (!await confirmar('Remover o cadastro de '+quem+'?\n\nA permissão, a conexão, o WhatsApp e o pedido de cadastro serão apagados. Se a pessoa abrir o painel de novo, ela volta para o modo consulta e precisa fazer o cadastro outra vez.\n\nPara tirar também o acesso ao painel, remova o e-mail dela no botão Compartilhar.')) return;
  t.disabled = true;
  try {
    const pessoas = {...((S.cfg && S.cfg.pessoas) || {})}; delete pessoas[id];
    await S.db.doc('config/geral').set({...S.cfg, pessoas});
    try { await S.db.doc('cadastros/'+id).delete(); } catch(err){}
    try { await S.db.doc('membros/'+id).delete(); } catch(err){}
    await logar('excluiu', 'config', 'Cadastro removido: '+quem, null, null);
    toast('Cadastro de '+quem+' removido');
  } catch(err){ falhaEscrita(err); }
  finally { t.disabled = false; }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t || !('salvarPessoas' in t.dataset) || !isAdm()) return;
  const pessoas = {};
  document.querySelectorAll('[data-p-papel]').forEach(sel => { const id = sel.dataset.pPapel; const con = document.querySelector('[data-p-con="'+id+'"]').value;
    const ant = (S.cfg && S.cfg.pessoas && S.cfg.pessoas[id]) || {}; const ped = (S.cadastros||{})[id] || {};
    pessoas[id] = {papel: sel.value, conexao: con || null, nome: ant.nome || ped.nome || S.names[id] || '', apelido: ant.apelido || ped.apelido || '', whatsapp: ant.whatsapp || ped.whatsapp || '', gestao: !!(document.querySelector('[data-p-gestao="'+id+'"]')||{}).checked, ministro: !!(document.querySelector('[data-p-min="'+id+'"]')||{}).checked}; });
  const falta = Object.entries(pessoas).filter(([id,p]) => (p.papel==='lider'||p.papel==='auxiliar') && !p.conexao);
  if (falta.length) { toast('Escolha a conexão de '+falta.map(([id])=>nome(id)).join(', ')+'.'); return; }
  const nAdm = Object.values(pessoas).filter(p=>p.papel==='admin').length;
  if (nAdm > 4 && !await confirmar('Serão '+(nAdm+1)+' administradores contando você. Confirmar?')) return;
  const resumo = 'Pessoas: ' + (Object.entries(pessoas).filter(([,p])=>p.papel!=='leitura').map(([id,p]) => nome(id)+' ('+PAPEIS[p.papel]+(p.conexao&&p.papel!=='admin'?' · '+conexaoNome(p.conexao):'')+')').join('; ') || 'só consulta');
  if (await salvar(S.db.doc('config/geral'), {...S.cfg, pessoas}, {acao:'editou', tipo:'config', resumo, antes:null})) toast('Pessoas salvas');
});

init();
})();
