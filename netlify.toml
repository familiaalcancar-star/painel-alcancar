# Site estático: o Netlify publica a pasta public/ como está (sem etapa de build).
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# O service worker (notificações) precisa ser sempre a versão mais nova.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# O endereço oficial agora é o GitHub Pages. Quem abrir o link antigo do Netlify
# é levado automaticamente para o novo (vale assim que o Netlify voltar a publicar).
[[redirects]]
  from = "/*"
  to = "https://familiaalcancar-star.github.io/painel-alcancar/:splat"
  status = 301
  force = true
