# Site estático: o Netlify publica a pasta public/ como está (sem etapa de build).
[build]
  publish = "public"
  # Cada publicação no Netlify gasta créditos do plano grátis (acabaram em 28/10 por excesso de publicações).
  # Por isso o Netlify só publica quando a mensagem do commit tem [publicar]; os outros commits são ignorados.
  ignore = "! git log -1 --pretty=%B | grep -q '\\[publicar\\]'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# O service worker (notificações) precisa ser sempre a versão mais nova.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

